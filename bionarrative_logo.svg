<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <!-- Gradient for the DNA/helix element -->
    <linearGradient id="helixGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for accent -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0F766E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Abstract DNA/Data helix mark -->
  <g transform="translate(10, 15)">
    <!-- Left strand -->
    <path d="M10 5 Q25 20, 10 35 Q-5 50, 10 65" 
          stroke="url(#helixGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Right strand -->
    <path d="M35 5 Q20 20, 35 35 Q50 50, 35 65" 
          stroke="url(#helixGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Connection bars (data points) -->
    <line x1="13" y1="12" x2="32" y2="12" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="28" x2="37" y2="28" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
    <line x1="13" y1="44" x2="32" y2="44" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="60" x2="37" y2="60" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Data nodes -->
    <circle cx="13" cy="12" r="3" fill="#0D9488"/>
    <circle cx="32" cy="12" r="3" fill="#0D9488"/>
    <circle cx="37" cy="28" r="3" fill="#14B8A6"/>
    <circle cx="8" cy="28" r="3" fill="#14B8A6"/>
    <circle cx="13" cy="44" r="3" fill="#0D9488"/>
    <circle cx="32" cy="44" r="3" fill="#0D9488"/>
    <circle cx="37" cy="60" r="3" fill="#14B8A6"/>
    <circle cx="8" cy="60" r="3" fill="#14B8A6"/>
  </g>
  
  <!-- Wordmark -->
  <text x="75" y="58" font-family="'Outfit', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="38" font-weight="600" fill="#1E293B">
    Bio<tspan fill="#0D9488">Narrative</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="76" y="78" font-family="'Outfit', 'Avenir Next', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#64748B" letter-spacing="0.5">
    Investor-Ready Market Intelligence
  </text>
</svg>
