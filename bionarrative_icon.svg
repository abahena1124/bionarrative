<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F766E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="5" y="5" width="90" height="90" rx="20" ry="20" fill="url(#bgGradient)"/>
  
  <!-- DNA/Data helix mark in white -->
  <g transform="translate(25, 18)">
    <!-- Left strand -->
    <path d="M10 5 Q25 20, 10 32 Q-5 44, 10 56" 
          stroke="white" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.95"/>
    <!-- Right strand -->
    <path d="M40 5 Q25 20, 40 32 Q55 44, 40 56" 
          stroke="white" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.95"/>
    
    <!-- Connection bars (data points) -->
    <line x1="13" y1="12" x2="37" y2="12" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="7" y1="32" x2="43" y2="32" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <line x1="13" y1="52" x2="37" y2="52" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Data nodes -->
    <circle cx="13" cy="12" r="4" fill="white"/>
    <circle cx="37" cy="12" r="4" fill="white"/>
    <circle cx="7" cy="32" r="4" fill="white"/>
    <circle cx="43" cy="32" r="4" fill="white"/>
    <circle cx="13" cy="52" r="4" fill="white"/>
    <circle cx="37" cy="52" r="4" fill="white"/>
  </g>
</svg>
